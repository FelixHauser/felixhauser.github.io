<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SchulAsset — Login</title>
  <link rel="stylesheet" href="login.css?v=20261114-12">
</head>
<body>

  <div class="login-card">

    <!-- App header -->
    <div class="login-header">
      <img src="mlks_logo.png" data-school-logo class="school-logo" alt="Martin-Luther-King-Schule">
      <div class="login-divider"></div>
      <h1 class="app-title">SchulAsset</h1>
      <p class="app-subtitle" data-i18n="login.subtitle">iPad-Verwaltung</p>
    </div>

    <!-- Language switcher -->
    <div class="lang-switcher">
      <button class="lang-btn" data-lang="de" onclick="setLang('de')">DE</button>
      <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
      <button class="lang-btn" data-lang="tr" onclick="setLang('tr')">TR</button>
    </div>

    <!-- Login form -->
    <form id="login-form" onsubmit="handleLogin(event)" novalidate>

      <div class="form-group">
        <label for="username" data-i18n="login.usernameLabel">E-Mail oder Seriennummer</label>
        <input
          type="text"
          id="username"
          autocomplete="username"
          spellcheck="false"
          autocapitalize="none"
          data-i18n-placeholder="login.usernamePlaceholder"
          placeholder="E-Mail oder Seriennummer"
          required
        >
        <p class="field-hint" data-i18n="login.usernameHint">
          Lehrkräfte: E-Mail-Adresse · Schüler / Eltern: Seriennummer
        </p>
      </div>

      <div class="form-group">
        <label for="password" data-i18n="login.passwordLabel">Passwort</label>
        <input
          type="password"
          id="password"
          autocomplete="current-password"
          required
        >
      </div>

      <!-- Error message (hidden until needed) -->
      <div id="error-msg" class="error-msg" hidden></div>

      <button type="submit" id="login-btn" class="login-btn">
        <span data-i18n="login.loginButton">Anmelden</span>
      </button>

      <div style="text-align:center;margin-top:0.75rem">
        <button type="button" class="btn-forgot-link" onclick="showForgotForm()" data-i18n="login.forgotLink">
          Passwort vergessen?
        </button>
      </div>

    </form>

    <!-- Auto-login message (shown when QR code params are in URL) -->
    <div id="autologin-msg" hidden style="text-align:center;padding:1.5rem 0;color:var(--text-secondary,#6b7280)">
      <p style="font-size:1rem;font-weight:600" data-i18n="login.loggingIn">Wird angemeldet…</p>
    </div>

    <!-- Forgot password form (admin only) -->
    <div id="forgot-section" hidden>
      <p style="font-size:0.85rem;color:var(--text-secondary,#6b7280);margin-bottom:1.25rem;text-align:center" data-i18n="login.forgotIntro">
        Geben Sie Ihre E-Mail-Adresse ein. Sie erhalten einen Reset-Link.
      </p>
      <div class="form-group">
        <label for="reset-email" data-i18n="login.emailLabel">E-Mail-Adresse</label>
        <input type="email" id="reset-email" autocomplete="email" placeholder="admin@schule.de">
      </div>
      <div id="reset-msg" class="error-msg" hidden></div>
      <button type="button" class="login-btn" onclick="handleForgotPassword()" data-i18n="login.sendResetLink">
        Reset-Link senden
      </button>
      <div style="text-align:center;margin-top:0.75rem">
        <button type="button" class="btn-forgot-link" onclick="showLoginForm()" data-i18n="login.backToLogin">← Zurück zum Login</button>
      </div>
    </div>

    <!-- New password form (shown after clicking the email reset link) -->
    <div id="new-password-section" hidden>
      <p style="font-size:0.85rem;color:var(--text-secondary,#6b7280);margin-bottom:1.25rem;text-align:center" data-i18n="login.newPasswordIntro">
        Wählen Sie ein neues Passwort für Ihr Konto.
      </p>
      <div class="form-group">
        <label for="new-password" data-i18n="login.newPasswordLabel">Neues Passwort</label>
        <input type="password" id="new-password" autocomplete="new-password">
      </div>
      <div id="new-pw-msg" class="error-msg" hidden></div>
      <button type="button" class="login-btn" onclick="handleNewPassword()" data-i18n="login.savePassword">
        Passwort speichern
      </button>
    </div>

    <!-- Legal links (pages are German only; labels follow the UI language) -->
    <nav class="legal-footer">
      <a href="datenschutz.html" data-i18n="legal.footerDatenschutz">Datenschutz</a>
      <span aria-hidden="true">·</span>
      <a href="impressum.html" data-i18n="legal.footerImpressum">Impressum</a>
    </nav>

  </div>

  <!-- Supabase JS client (CDN) — must come before our own scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.min.js"></script>
  <!-- Our files, in dependency order -->
  <script src="school-config.js?v=20261114-12"></script>
  <script src="supabase-client.js?v=20261114-12"></script>
  <script src="translations.js?v=20261114-12"></script>
  <script src="qr-login-url.js?v=20261114-12"></script>
  <script src="auth.js?v=20261114-12"></script>
  <script>
    // Apply translations on first load (language is read from localStorage or defaults to 'de').
    applyTranslations();
  </script>

</body>
</html>

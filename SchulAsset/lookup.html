<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SchulAsset — iPad nachschlagen</title>
  <!-- admin.css gives the shared look (search field, cards, timeline); lookup.css only adds the page shell. -->
  <link rel="stylesheet" href="admin.css?v=20261114-11">
  <link rel="stylesheet" href="lookup.css?v=20261114-11">
</head>
<body class="lookup-body">

  <header class="lookup-header">
    <img src="mlks_logo.png" data-school-logo alt="" class="lookup-logo">
    <span class="lookup-title">SchulAsset</span>
    <span id="lookup-user" class="lookup-user"></span>
    <button class="lookup-logout" onclick="lookupLogout()">Abmelden</button>
  </header>

  <main class="lookup-main">

    <!-- Step 1: serial number → owner's name -->
    <section class="dash-search-section">
      <h1 class="section-title">iPad nachschlagen</h1>
      <div class="dash-search-bar">
        <input type="text" id="lookup-input" class="sn-input"
               placeholder="Seriennummer eingeben…"
               spellcheck="false" autocapitalize="characters" autocomplete="off">
        <button class="btn-search" onclick="lookupSearch()">Suchen</button>
        <button class="btn-qr" onclick="openQrScanner()" title="QR-Code scannen" aria-label="QR-Code scannen">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 3h7v7H3V3zm1.5 1.5v4h4v-4h-4zM14 3h7v7h-7V3zm1.5 1.5v4h4v-4h-4zM3 14h7v7H3v-7zm1.5 1.5v4h4v-4h-4zM14 14h2v2h-2v-2zm3 0h2v2h-2v-2zm-3 3h2v2h-2v-2zm3 0h2v2h-2v-2z"/>
          </svg>
        </button>
      </div>
      <div id="lookup-result" class="search-result-area"></div>
    </section>

    <!-- Step 2: everything else (filled only after "Details anzeigen") -->
    <section id="lookup-details" class="lookup-details" hidden></section>

  </main>

  <!-- QR scanner overlay -->
  <div id="qr-modal" class="qr-modal" hidden>
    <div class="qr-modal-inner">
      <p class="qr-hint">Kamera auf den QR-Code richten</p>
      <div id="qr-reader"></div>
      <button class="btn-qr-cancel" onclick="closeQrScanner()">Abbrechen</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="school-config.js?v=20261114-11"></script>
  <script src="supabase-client.js?v=20261114-11"></script>
  <script src="escape-html.js?v=20261114-11"></script>
  <script src="lookup.js?v=20261114-11"></script>
  <script>initLookup();</script>
</body>
</html>
